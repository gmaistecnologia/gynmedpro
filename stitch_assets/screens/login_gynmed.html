<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Gynmed Digital Experience</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#0059af",
              "on-error": "#ffffff",
              "outline-variant": "#c1c6d5",
              "on-tertiary-fixed-variant": "#005142",
              "tertiary": "#006654",
              "surface-bright": "#f8f9fa",
              "tertiary-fixed-dim": "#56dcbd",
              "primary-container": "#1271d8",
              "primary-fixed-dim": "#a9c7ff",
              "on-primary-fixed-variant": "#00468c",
              "on-secondary-container": "#345d80",
              "on-tertiary": "#ffffff",
              "inverse-on-surface": "#f0f1f2",
              "surface-container-lowest": "#ffffff",
              "on-surface-variant": "#414753",
              "on-primary": "#ffffff",
              "surface-tint": "#005db7",
              "secondary-container": "#add6fe",
              "on-primary-container": "#f8f8ff",
              "on-surface": "#191c1d",
              "surface": "#f8f9fa",
              "background": "#f8f9fa",
              "error-container": "#ffdad6",
              "surface-container-high": "#e7e8e9",
              "inverse-primary": "#a9c7ff",
              "on-secondary-fixed": "#001d32",
              "surface-variant": "#e1e3e4",
              "tertiary-container": "#00816b",
              "error": "#ba1a1a",
              "secondary-fixed": "#cde5ff",
              "tertiary-fixed": "#76f9d9",
              "on-tertiary-fixed": "#002019",
              "surface-container-low": "#f3f4f5",
              "secondary": "#396285",
              "on-secondary": "#ffffff",
              "secondary-fixed-dim": "#a2cbf3",
              "on-tertiary-container": "#e1fff4",
              "on-background": "#191c1d",
              "surface-dim": "#d9dadb",
              "on-primary-fixed": "#001b3d",
              "on-secondary-fixed-variant": "#1e4a6c",
              "surface-container-highest": "#e1e3e4",
              "surface-container": "#edeeef",
              "outline": "#727784",
              "inverse-surface": "#2e3132",
              "primary-fixed": "#d6e3ff",
              "on-error-container": "#93000a"
            },
            fontFamily: {
              "headline": ["Montserrat"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "0.5rem", "lg": "0.75rem", "xl": "1rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.8);
        }
        .shadow-ambient {
            box-shadow: 0 8px 24px rgba(11, 61, 94, 0.06);
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
<!-- Background Abstract Shapes (Santuário de Precisão Aesthetics) -->
<div class="absolute top-[-10%] left-[-5%] w-[40%] h-[40%] rounded-full bg-primary-fixed/20 blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[35%] h-[35%] rounded-full bg-secondary-fixed/20 blur-[100px] pointer-events-none"></div>
<!-- Main Content Canvas -->
<main class="w-full max-w-md z-10">
<!-- Header / Brand Anchor -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center mb-6">
<span class="font-headline font-black text-4xl tracking-tighter text-[#0B3D5E]">
                    Gynmed
                </span>
<span class="ml-1 w-2 h-2 rounded-full bg-primary-container"></span>
</div>
<h1 class="font-headline font-bold text-xl text-secondary tracking-tight">
                Portal Gynmed - Solicitações de Cirurgia
            </h1>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest shadow-ambient rounded-xl p-8 border border-outline-variant/10">
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant ml-1" for="email">E-mail</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="block w-full pl-12 pr-4 py-3.5 bg-surface-container-lowest border border-outline-variant/20 rounded-lg text-on-surface placeholder:text-outline/50 focus:outline-none focus:ring-2 focus:ring-primary/10 focus:border-primary transition-all duration-200" id="email" name="email" placeholder="exemplo@gynmed.com.br" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-sm font-medium text-on-surface-variant ml-1" for="password">Senha</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="block w-full pl-12 pr-12 py-3.5 bg-surface-container-lowest border border-outline-variant/20 rounded-lg text-on-surface placeholder:text-outline/50 focus:outline-none focus:ring-2 focus:ring-primary/10 focus:border-primary transition-all duration-200" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-secondary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="text-sm font-semibold text-primary-container hover:underline underline-offset-4 transition-all" href="#">
                        Esqueceu a senha?
                    </a>
</div>
<!-- Login Action -->
<button class="w-full py-4 bg-gradient-to-r from-primary-container to-primary text-white font-bold rounded-lg shadow-lg shadow-primary/20 hover:scale-[1.01] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                    Entrar
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer Help/Info (Optional Contextual Element) -->
<div class="mt-10 pt-8 border-t border-outline-variant/10 text-center">
<p class="text-xs text-outline font-medium tracking-wide uppercase">
                    Acesso restrito a profissionais autorizados
                </p>
</div>
</div>
<!-- Support Info -->
<div class="mt-8 flex flex-col md:flex-row justify-between items-center px-4 gap-4">
<p class="text-xs text-on-surface-variant font-medium">
                © 2024 Gynmed Digital Experience
            </p>
<div class="flex gap-4">
<a class="text-xs text-outline font-semibold hover:text-primary transition-colors" href="#">Suporte Técnico</a>
<a class="text-xs text-outline font-semibold hover:text-primary transition-colors" href="#">Privacidade</a>
</div>
</div>
</main>
<!-- Visual Anchor Decorations -->
<div class="fixed bottom-12 left-12 hidden lg:block opacity-20">
<div class="w-32 h-32 border-l border-b border-primary-container/40 rounded-bl-3xl"></div>
</div>
<div class="fixed top-12 right-12 hidden lg:block opacity-20">
<div class="w-32 h-32 border-r border-t border-primary-container/40 rounded-tr-3xl"></div>
</div>
</body></html>
